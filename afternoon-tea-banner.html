<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠闲下午茶 - 易拉宝</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f0e8;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Noto Serif SC', 'FangSong', '仿宋', serif;
        }
        
        /* 易拉宝主体 - 标准易拉宝尺寸 80cm x 200cm，按比例缩放 */
        .banner {
            width: 400px;
            height: 1000px;
            background: linear-gradient(180deg, #faf6f0 0%, #f0ebe3 50%, #e8e0d4 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        /* 顶部装饰花纹 */
        .top-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, #5a7c5a 0%, #7a9c7a 100%);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
        }
        
        .top-pattern::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: #faf6f0;
            border-radius: 50%;
        }
        
        /* 主视觉区域 */
        .hero-section {
            padding-top: 140px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        /* 手绘风格茶具 SVG */
        .tea-illustration {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
        }
        
        /* 主题大字 - 艺术书法风格 */
        .main-title {
            font-size: 52px;
            font-weight: 900;
            color: #3d5c3d;
            letter-spacing: 12px;
            line-height: 1.3;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.08);
        }
        
        .main-title .char {
            display: inline-block;
            transform: rotate(-3deg);
        }
        
        .main-title .char:nth-child(2) {
            transform: rotate(2deg) translateY(-5px);
        }
        
        .main-title .char:nth-child(3) {
            transform: rotate(-1deg);
        }
        
        .main-title .char:nth-child(4) {
            transform: rotate(3deg) translateY(-3px);
        }
        
        .main-title .char:nth-child(5) {
            transform: rotate(-2deg);
        }
        
        /* 副标题 */
        .subtitle {
            font-size: 22px;
            color: #8b7355;
            letter-spacing: 8px;
            margin-bottom: 40px;
            font-weight: 400;
        }
        
        /* 装饰分隔线 */
        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a08060, transparent);
            margin: 0 auto 40px;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '❧';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #a08060;
            font-size: 14px;
        }
        
        .divider::before {
            left: -20px;
        }
        
        .divider::after {
            right: -20px;
        }
        
        /* 信息区域 */
        .info-section {
            padding: 0 50px;
            text-align: center;
        }
        
        .info-item {
            margin-bottom: 30px;
        }
        
        .info-label {
            font-size: 16px;
            color: #a08060;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        
        .info-value {
            font-size: 20px;
            color: #4a4a4a;
            letter-spacing: 2px;
            font-weight: 600;
        }
        
        /* 诗意文案 */
        .poem {
            margin: 50px 40px;
            padding: 30px;
            border-left: 3px solid #a08060;
            border-right: 3px solid #a08060;
            text-align: center;
        }
        
        .poem-line {
            font-size: 18px;
            color: #5a5a5a;
            line-height: 2.2;
            letter-spacing: 3px;
        }
        
        .poem-line:first-child {
            font-size: 20px;
            color: #3d5c3d;
            font-weight: 600;
        }
        
        /* 底部装饰 */
        .bottom-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(180deg, transparent 0%, #5a7c5a 100%);
        }
        
        .bottom-leaves {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        .leaf-icon {
            font-size: 30px;
            color: #faf6f0;
            opacity: 0.6;
            margin: 0 10px;
        }
        
        /* 二维码区域 */
        .qr-section {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
        }
        
        .qr-placeholder {
            width: 100px;
            height: 100px;
            background: #faf6f0;
            border: 2px solid #a08060;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 12px;
            color: #a08060;
        }
        
        .qr-text {
            font-size: 14px;
            color: #faf6f0;
            letter-spacing: 2px;
        }
        
        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .banner {
                box-shadow: none;
                width: 80mm;
                height: 200mm;
            }
        }
        
        /* 装饰性茶叶飘落 */
        .floating-leaf {
            position: absolute;
            font-size: 20px;
            color: #a08060;
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- 顶部装饰 -->
        <div class="top-pattern"></div>
        
        <!-- 飘落茶叶装饰 -->
        <div class="floating-leaf" style="top: 200px; left: 30px;">🍃</div>
        <div class="floating-leaf" style="top: 350px; right: 40px; animation-delay: 2s;">🍃</div>
        <div class="floating-leaf" style="top: 500px; left: 50px; animation-delay: 4s;">🍃</div>
        <div class="floating-leaf" style="top: 650px; right: 30px; animation-delay: 6s;">🍃</div>
        
        <!-- 主视觉 -->
        <div class="hero-section">
            <!-- 手绘茶具 SVG -->
            <svg class="tea-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- 茶盘 -->
                <ellipse cx="100" cy="170" rx="80" ry="15" fill="#c4a882" opacity="0.3"/>
                <ellipse cx="100" cy="168" rx="75" ry="12" fill="#d4b892" opacity="0.5"/>
                
                <!-- 茶壶 -->
                <path d="M60 120 Q60 80 100 75 Q140 80 140 120 Q140 150 100 155 Q60 150 60 120" fill="#8b9d8b" stroke="#6b7d6b" stroke-width="1.5"/>
                <!-- 茶壶盖 -->
                <ellipse cx="100" cy="78" rx="25" ry="8" fill="#7a8d7a" stroke="#6b7d6b" stroke-width="1"/>
                <circle cx="100" cy="72" r="6" fill="#6b7d6b"/>
                <!-- 壶嘴 -->
                <path d="M140 110 Q160 100 165 90 Q170 85 168 95 Q165 105 145 115" fill="#8b9d8b" stroke="#6b7d6b" stroke-width="1"/>
                <!-- 壶把 -->
                <path d="M60 100 Q40 90 40 110 Q40 130 55 135" fill="none" stroke="#6b7d6b" stroke-width="4" stroke-linecap="round"/>
                
                <!-- 茶杯 -->
                <path d="M85 140 L85 165 Q85 175 100 175 Q115 175 115 165 L115 140" fill="#f5f0e8" stroke="#c4a882" stroke-width="1.5"/>
                <ellipse cx="100" cy="140" rx="15" ry="4" fill="#d4b892" opacity="0.5"/>
                <!-- 茶水 -->
                <ellipse cx="100" cy="142" rx="12" ry="3" fill="#a08060" opacity="0.4"/>
                
                <!-- 小茶杯 -->
                <path d="M130 145 L130 162 Q130 170 140 170 Q150 170 150 162 L150 145" fill="#f5f0e8" stroke="#c4a882" stroke-width="1.2"/>
                <ellipse cx="140" cy="145" rx="10" ry="3" fill="#d4b892" opacity="0.5"/>
                
                <!-- 蒸汽 -->
                <path d="M95 135 Q90 125 95 115 Q100 105 95 95" fill="none" stroke="#a08060" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
                <path d="M105 138 Q110 128 105 118 Q100 108 105 98" fill="none" stroke="#a08060" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
                
                <!-- 茶叶装饰 -->
                <ellipse cx="70" cy="160" rx="8" ry="3" fill="#7a9c7a" opacity="0.4" transform="rotate(-20 70 160)"/>
                <ellipse cx="160" cy="155" rx="6" ry="2.5" fill="#7a9c7a" opacity="0.4" transform="rotate(15 160 155)"/>
                <ellipse cx="50" cy="145" rx="7" ry="3" fill="#7a9c7a" opacity="0.3" transform="rotate(-10 50 145)"/>
            </svg>
            
            <!-- 主标题 -->
            <h1 class="main-title">
                <span class="char">慢</span>
                <span class="char">下</span>
                <span class="char">来</span>
                <span class="char">，</span>
                <span class="char">才</span>
                <span class="char">有</span>
                <span class="char">味</span>
                <span class="char">道</span>
            </h1>
            
            <!-- 副标题 -->
            <p class="subtitle">悠闲下午茶</p>
            
            <!-- 分隔线 -->
            <div class="divider"></div>
        </div>
        
        <!-- 信息区域 -->
        <div class="info-section">
            <div class="info-item">
                <p class="info-label">时 间</p>
                <p class="info-value">2025年7月12日 14:00</p>
            </div>
            
            <div class="info-item">
                <p class="info-label">地 点</p>
                <p class="info-value">花园露台 · 阳光厅</p>
            </div>
            
            <div class="info-item">
                <p class="info-label">着 装</p>
                <p class="info-value">休闲舒适</p>
            </div>
        </div>
        
        <!-- 诗意文案 -->
        <div class="poem">
            <p class="poem-line">一盏清茶，半日悠闲</p>
            <p class="poem-line">与时光对坐，与自己和解</p>
            <p class="poem-line">在忙碌的日子里</p>
            <p class="poem-line">偷得浮生半日闲</p>
        </div>
        
        <!-- 二维码 -->
        <div class="qr-section">
            <div class="qr-placeholder">
                扫码报名
            </div>
            <p class="qr-text">期待与您相遇</p>
        </div>
        
        <!-- 底部装饰 -->
        <div class="bottom-section">
            <div class="bottom-leaves">
                <span class="leaf-icon">🌿</span>
                <span class="leaf-icon">🍵</span>
                <span class="leaf-icon">🌿</span>
            </div>
        </div>
    </div>
</body>
</html>
