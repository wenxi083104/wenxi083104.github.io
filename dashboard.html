            // 每个分类内按 order 排序
            let html = '<div class="kanban-board">';
            categories.forEach(cat => {
                const catTasks = projects.filter(t => t.category === cat).sort((a, b) => (a.order || 0) - (b.order || 0));
                html += `
                <div class="kanban-lane" data-category="${cat}">
                    <div class="kanban-lane-header">
                        <span class="kanban-lane-title">${cat}</span>
                        <span class="kanban-lane-count">${catTasks.length}</span>
                    </div>
                    <div class="kanban-cards" data-category="${cat}">
                        ${catTasks.map(t => renderKanbanCard(t)).join('')}
                        ${catTasks.length === 0 ? '<div class="kanban-empty">拖拽任务到此处</div>' : ''}
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;

            // 绑定卡片点击打开详情
            container.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.kanban-card')) {
                        openTaskDetail(this.dataset.taskId);
                    }
                });
            });

            // 初始化 SortableJS 拖拽
            initKanbanSortable();
        }

        function renderKanbanCard(task) {
            const today = new Date().toISOString().split('T')[0];
            const dueClass = task.dueDate
                ? (task.dueDate < today ? 'overdue' : task.dueDate === today ? 'today' : '')
                : '';
            const progress = task.progress || 0;
            return `
            <div class="kanban-card" data-task-id="${task.id}">
                <div class="kanban-card-name">${task.name}</div>
                <div class="kanban-card-meta">
                    <span class="kanban-card-due ${dueClass}">📅 ${task.dueDate || '无截止日期'}</span>
                    <span>${renderPriority(task.priority)}</span>
                </div>
                <div class="kanban-progress-wrap">
                    <div class="kanban-progress-bar">
                        <div class="kanban-progress-fill" style="width:${progress}%"></div>
                    </div>
                    <span class="kanban-progress-text">${progress}%</span>
                </div>
            </div>`;
        }

        function initKanbanSortable() {
            // 销毁旧的 sortable 实例
            kanbanSortables.forEach(s => s.destroy());
            kanbanSortables = [];

            document.querySelectorAll('.kanban-cards').forEach(el => {
                const sortable = new Sortable(el, {
                    group: 'kanban', // 允许跨泳道拖拽
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function(evt) {
                        const newCategory = evt.to.dataset.category;
                        const oldCategory = evt.from.dataset.category;
                        const taskId = evt.item.dataset.taskId;
                        const currentTasksArr = getCurrentTasks();
                        const task = currentTasksArr.find(t => t.id === taskId);
                        if (!task) return;

                        // 更新 category
                        if (newCategory !== oldCategory) {
                            task.category = newCategory;
                        }

                        // 更新 order：按新顺序重新分配
                        const newOrderIds = [...evt.to.children]
                            .filter(child => child.classList.contains('kanban-card'))
                            .map(child => child.dataset.taskId);

                        newOrderIds.forEach((id, idx) => {
                            const t = currentTasksArr.find(x => x.id === id);
                            if (t) t.order = idx;
                        });

                        saveTasks();
                        refreshAll();
                    }
                });
                kanbanSortables.push(sortable);
            });
        }

        // ==================== 风险预警 ====================

        function updateRisks() {
            const currentTasks = getCurrentTasks();
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            // 计算 today+1 和 today+3 的日期字符串
            const d1 = new Date(today); d1.setDate(d1.getDate() + 1);
            const d3 = new Date(today); d3.setDate(d3.getDate() + 3);
            const soonStart = d1.toISOString().split('T')[0];
            const soonEnd = d3.toISOString().split('T')[0];

            const active = currentTasks.filter(t => t.status !== 'archived');

            // 已超期：未完成 且 dueDate < 今天
            const overdue = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < todayStr);

            // 即将到期：未完成 且 dueDate 在 [today+1, today+3]
            const soon = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate >= soonStart && t.dueDate <= soonEnd);

            // 阻塞卡点：blocked === true 且 未完成
            const blocked = active.filter(t => t.blocked === true && t.status !== 'done');

            // 渲染已超期
            document.getElementById('riskOverdueCount').textContent = overdue.length;
            const overdueEl = document.getElementById('riskOverdueList');
            if (overdue.length === 0) {
                overdueEl.innerHTML = '<div class="risk-item">暂无已超期的任务</div>';
            } else {
                overdueEl.innerHTML = overdue.map(t => {
                    const days = Math.ceil((today - new Date(t.dueDate)) / 86400000);
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            <span class="risk-item-days overdue">延迟${days}天</span>
                        </div>
                    </div>`;
                }).join('');
            }

            // 渲染即将到期
            document.getElementById('riskSoonCount').textContent = soon.length;
            const soonEl = document.getElementById('riskSoonList');
            if (soon.length === 0) {
                soonEl.innerHTML = '<div class="risk-item">暂无即将到期的任务</div>';
            } else {
                soonEl.innerHTML = soon.map(t => {
                    const days = Math.ceil((new Date(t.dueDate) - today) / 86400000);
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            <span class="risk-item-days soon">剩余${days}天</span>
                        </div>
                    </div>`;
                }).join('');
            }

            // 渲染阻塞卡点
            document.getElementById('riskBlockCount').textContent = blocked.length;
            const blockEl = document.getElementById('riskBlockList');
            if (blocked.length === 0) {
                blockEl.innerHTML = '<div class="risk-item">暂无阻塞中的任务</div>';
            } else {
                blockEl.innerHTML = blocked.map(t => {
                    const daysText = t.dueDate
                        ? (t.dueDate < todayStr
                            ? `<span class="risk-item-days overdue">延迟${Math.ceil((today - new Date(t.dueDate)) / 86400000)}天</span>`
                            : `<span class="risk-item-days soon">剩余${Math.ceil((new Date(t.dueDate) - today) / 86400000)}天</span>`)
                        : '';
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            ${daysText}
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // ==================== 待办清单 ====================

        // 待办视图状态
        let todoFilter = 'all'; // 'all' | 'in-progress' | 'done'

        // 四象限排序权重
        function quadrantWeight(task) {
            if (task.urgency === 'urgent' && task.priority === 'high') return 1;       // 紧急+重要
            if (task.priority === 'high' && task.urgency === 'normal') return 2;        // 重要不紧急
            if (task.urgency === 'urgent' && task.priority !== 'high') return 3;       // 紧急不重要
            return 4;                                                                   // 其他
        }

        // 渲染待办清单
        function renderTodo() {
            const container = document.getElementById('todoContainer');
            const statsEl = document.getElementById('todoStats');
            if (!container) return;

            const currentTasks = getCurrentTasks();
            const today = new Date().toISOString().split('T')[0];

            // 基础过滤：type === "task" 且 status !== "archived"
            let filtered = currentTasks.filter(t => t.type === 'task' && t.status !== 'archived');

            // 视图过滤
            if (todoFilter === 'in-progress') {
                filtered = filtered.filter(t => t.status === 'in-progress');
            } else if (todoFilter === 'done') {
                filtered = filtered.filter(t => t.status === 'done');
            }

            // 四象限排序 + 同象限按截止日期升序
            filtered.sort((a, b) => {
                const wA = quadrantWeight(a);
                const wB = quadrantWeight(b);
                if (wA !== wB) return wA - wB;
                // 同象限按截止日期升序，无日期排后面
                if (!a.dueDate && !b.dueDate) return 0;
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return a.dueDate.localeCompare(b.dueDate);
            });

            // 今日统计
            const todayDone = currentTasks.filter(t => t.completedDate === today).length;
            const todayDue = currentTasks.filter(t => t.dueDate === today && t.status !== 'archived').length;
            const todayRate = todayDue > 0 ? Math.round((todayDone / todayDue) * 100) : (todayDone > 0 ? 100 : 0);

            statsEl.innerHTML = `
                <span>今日完成 <span class="stat-num">${todayDone}</span> 项</span>
                <span>待办完成率 <span class="stat-num">${todayRate}%</span></span>
            `;

            // 空状态
            if (filtered.length === 0) {
                container.innerHTML = '<div class="todo-empty">暂无符合条件的待办任务</div>';
                return;
            }

            // 渲染列表
            let html = '<ul class="todo-list">';
            filtered.forEach(task => {
                const isDone = task.status === 'done';
                const dueClass = task.dueDate
                    ? (task.dueDate < today ? 'is-overdue' : task.dueDate === today ? 'is-today' : '')
                    : '';

                html += `
                <li class="todo-item ${isDone ? 'is-done' : ''}" data-task-id="${task.id}">
                    <input type="checkbox" class="todo-checkbox" ${isDone ? 'checked' : ''}>
                    <div class="todo-info">
                        <div class="todo-name" data-task-id="${task.id}">${task.name}</div>
                        <div class="todo-meta">
                            ${renderPriority(task.priority)}
                            ${renderUrgency(task.urgency)}
                            <span class="todo-tag todo-tag-category">${task.category}</span>
                        </div>
                    </div>
                    <div class="todo-due ${dueClass}">${task.dueDate || '-'}</div>
                </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;

            // 绑定复选框事件
            container.querySelectorAll('.todo-checkbox').forEach(cb => {
                cb.addEventListener('change', function() {
                    const taskId = this.closest('.todo-item').dataset.taskId;
                    const currentTasksArr = getCurrentTasks();
                    const task = currentTasksArr.find(t => t.id === taskId);
                    if (!task) return;

                    if (this.checked) {
                        task.status = 'done';
                        task.completedDate = today;
                    } else {
                        task.status = 'todo';
                        task.completedDate = null;
                    }
                    saveTasks();
                    updateKPI();
                    updateRisks();
                    renderTodo();
                    renderTable();
                });
            });

            // 绑定任务名称点击
            container.querySelectorAll('.todo-name').forEach(nameEl => {
                nameEl.addEventListener('click', function() {
                    openTaskDetail(this.dataset.taskId);
                });
            });
        }

        // 绑定待办筛选按钮
        function bindTodoFilters() {
            document.querySelectorAll('.todo-filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {

                    this.classList.add('active');

        // 防抖函数
        function debounce(fn, delay) {
            let timer = null;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, arguments), delay);
            };
        }

        // ==================== 运营仪表盘 ====================

        // 生成环形图 SVG
        function ringChart(pct, color, label) {
            const r = 45;
            const c = 2 * Math.PI * r;
            const offset = c - (pct / 100) * c;
            return `<div class="ring-chart-wrap">
                <div class="ring-chart">
                    <svg width="120" height="120" viewBox="0 0 120 120">
                        <circle class="ring-chart-bg" cx="60" cy="60" r="${r}"/>
                        <circle class="ring-chart-fill" cx="60" cy="60" r="${r}"
                            stroke="${color}"
                            stroke-dasharray="${c}"
                            stroke-dashoffset="${offset}"/>
                    </svg>
                    <div class="ring-chart-label">
                        <div class="ring-chart-num">${pct}%</div>
                    </div>
                </div>
                <div class="ring-chart-text">${label}</div>
            </div>`;
        }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            if (!container) return;

            const currentTasks = getCurrentTasks();
            const today = new Date().toISOString().split('T')[0];
            const active = currentTasks.filter(t => t.status !== 'archived');

            // 6模块完成率对比
            const catCompletion = CATEGORIES.map(cat => {
                const catTasks = active.filter(t => t.category === cat.key);
                const total = catTasks.length;
                const done = catTasks.filter(t => t.status === 'done').length;
                return { ...cat, total, done, rate: total > 0 ? Math.round(done / total * 100) : 0 };
            });
            const maxRate = Math.max(...catCompletion.map(c => c.rate), 1);

            // 优先级-紧急度矩阵（四象限热力图）
            const matrix = {
                'high-urgent': active.filter(t => t.priority === 'high' && t.urgency === 'urgent').length,
                'high-normal': active.filter(t => t.priority === 'high' && t.urgency === 'normal').length,
                'low-urgent': active.filter(t => t.priority !== 'high' && t.urgency === 'urgent').length,
                'low-normal': active.filter(t => t.priority !== 'high' && t.urgency === 'normal').length
            };
            const maxMatrixVal = Math.max(...Object.values(matrix), 1);

            // 本周vs上周完成趋势
            const weekData = getWeekTrend();

            // 模块健康度评分（0-100分，基于完成率和延期率计算）

                const done = catTasks.filter(t => t.status === 'done').length;
                const overdue = catTasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < today).length;
                const rate = done / total;
                const overdueRate = overdue / total;
                // 评分公式：完成率*70 + (1-延期率)*30，封顶100
                let score = Math.round(rate * 70 + (1 - overdueRate) * 30);
                if (score < 0) score = 0;
                let label = '优秀';
                if (score < 60) label = '告警';
                else if (score < 80) label = '关注';
                return { ...cat, score, label, total, done, overdue };
            });

                            <div style="font-size:11px;color:var(--warning);font-weight:600">高优+常规</div>
                            <div style="font-size:22px;font-weight:700;color:var(--text-primary);margin-top:4px">${matrix['high-normal']}</div>

                        <div style="padding:12px;border-radius:10px;background:rgba(37,99,235,${0.08 + matrix['low-urgent']/maxMatrixVal*0.15});border:1px solid rgba(37,99,235,0.15)">

                <!-- 本周vs上周完成趋势 -->

                    <div style="display:flex;gap:12px;margin-top:8px">

                    </div>
                    <div style="margin-top:12px;height:80px;display:flex;align-items:flex-end;gap:6px;padding:0 8px">

                <!-- 模块健康度评分 -->

                    <div class="quadrant-grid">
                        ${renderQuadrant('q1', '🔴 紧急且重要', active.filter(t => t.status !== 'done' && t.priority === 'high' && t.urgency === 'urgent'))}
                        ${renderQuadrant('q2', '🟡 重要不紧急', active.filter(t => t.status !== 'done' && t.priority === 'high' && t.urgency === 'normal'))}
                        ${renderQuadrant('q3', '🔵 紧急不重要', active.filter(t => t.status !== 'done' && t.priority !== 'high' && t.urgency === 'urgent'))}
                        ${renderQuadrant('q4', '⚪ 常规事项', active.filter(t => t.status !== 'done' && t.priority !== 'high' && t.urgency === 'normal'))}

                </div>

                <!-- 最近动态 -->
                <div class="dash-card full-width">
                    <div class="dash-card-title">🕐 最近动态</div>

                        ${renderTimeline(active, today)}

                </div>

        }

        function getWeekTrend() {
            const currentTasks = getCurrentTasks();
            const today = new Date();
            const dayOfWeek = today.getDay() || 7; // 1-7
            const weekStart = new Date(today); weekStart.setDate(today.getDate() - dayOfWeek + 1);
            const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(weekStart.getDate() - 7);
            const days = ['一','二','三','四','五','六','日'];
            const daily = [];
            let thisWeekTotal = 0, lastWeekTotal = 0;
            for (let i = 0; i < 7; i++) {
                const d1 = new Date(weekStart); d1.setDate(weekStart.getDate() + i);
                const d2 = new Date(lastWeekStart); d2.setDate(lastWeekStart.getDate() + i);
                const s1 = d1.toISOString().split('T')[0];
                const s2 = d2.toISOString().split('T')[0];
                const c1 = currentTasks.filter(t => t.completedDate === s1).length;
                const c2 = currentTasks.filter(t => t.completedDate === s2).length;
                thisWeekTotal += c1;
                lastWeekTotal += c2;
                daily.push({ day: days[i], thisWeek: c1, lastWeek: c2 });
            }
            const change = lastWeekTotal > 0 ? Math.round((thisWeekTotal - lastWeekTotal) / lastWeekTotal * 100) : (thisWeekTotal > 0 ? 100 : 0);
            return { thisWeek: thisWeekTotal, lastWeek: lastWeekTotal, change, daily };
        }

        function renderQuadrant(cls, title, items) {
            if (items.length === 0) {
                return `<div class="quadrant-card ${cls}">
                    <div class="quadrant-header">
                        <span class="quadrant-title ${cls}">${title}</span>
                        <span class="quadrant-count">0</span>
                    </div>
                    <div class="quadrant-empty">暂无</div>
                </div>`;
            }
            return `<div class="quadrant-card ${cls}">
                <div class="quadrant-header">
                    <span class="quadrant-title ${cls}">${title}</span>
                    <span class="quadrant-count">${items.length}</span>
                </div>
                <ul class="quadrant-list">
                    ${items.map(t => `<li class="quadrant-item" onclick="openTaskDetail('${t.id}')">
                        <span class="quadrant-item-name">${t.name}</span>
                        <span class="quadrant-item-due">${t.dueDate || ''}</span>
                    </li>`).join('')}
                </ul>
            </div>`;
        }

        function renderTimeline(active, today) {
            const recent = [...active]
                .filter(t => t.completedDate || t.dueDate)
                .sort((a, b) => {
                    const da = a.completedDate || a.dueDate;
                    const db = b.completedDate || b.dueDate;
                    return db.localeCompare(da);
                })
                .slice(0, 8);

            if (recent.length === 0) return '<div class="gantt-empty">暂无任务动态</div>';

            return recent.map(t => {
                const dotClass = t.status === 'done' ? 'done' : t.status === 'in-progress' ? 'progress' : 'todo';
                const dateText = t.completedDate ? `完成于 ${t.completedDate}` : `截止 ${t.dueDate || '未设置'}`;
                return `<div class="dash-timeline-item" style="cursor:pointer" onclick="openTaskDetail('${t.id}')">
                    <span class="dash-timeline-dot ${dotClass}"></span>
                    <div class="dash-timeline-content">
                        <div class="dash-timeline-name">${t.name}</div>
                        <div class="dash-timeline-date">${dateText} · ${t.category} · ${statusLabel(t.status)}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // ==================== 甘特图（自定义时间轴） ====================

        let ganttViewMode = 'week';

        function renderGantt() {
            const container = document.getElementById('ganttContainer');
            if (!container) return;

            const currentTasks = getCurrentTasks();
            const ganttTasks = currentTasks.filter(t => t.status !== 'archived' && t.dueDate);

            if (ganttTasks.length === 0) {
                container.innerHTML = '<div class="gantt-empty">暂无可显示的甘特图数据，请确保任务有截止日期</div>';
                return;
            }

            // 计算时间范围
            const range = getGanttRange(ganttViewMode);
            const days = Math.round((range.end - range.start) / (1000 * 60 * 60 * 24)) + 1;
            const dayWidth = ganttViewMode === 'day' ? 80 : ganttViewMode === 'week' ? 40 : 20;
            const totalWidth = days * dayWidth;
            const today = new Date();
            today.setHours(0,0,0,0);

            // 生成头部日期
            let headerCells = '';
            for (let i = 0; i < days; i++) {
                const d = new Date(range.start);
                d.setDate(d.getDate() + i);
                const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                const label = ganttViewMode === 'day'
                    ? `${d.getMonth()+1}/${d.getDate()}`
                    : ganttViewMode === 'week'
                        ? (d.getDay() === 1 || i === 0 ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getDate()}`)
                        : (d.getDate() === 1 || i === 0 ? `${d.getMonth()+1}月` : '');
                headerCells += `<div class="timeline-header-cell" style="width:${dayWidth}px;${isWeekend?'background:#f0f1f5;':''}">${label}</div>`;
            }

            // 生成任务行
            let sidebarRows = '';
            let gridRows = '';
            const priorityColor = { high: '#fee2e2', medium: '#fef3c7', low: '#eef2ff' };
            const priorityText = { high: '高', medium: '中', low: '低' };

            ganttTasks.forEach(t => {
                const statusColors = {
                    done: 'var(--success-light)',
                    'in-progress': 'var(--info-light)',
                    todo: 'var(--border-light)',
                    blocked: 'var(--danger-light)'
                };
                const statusLabels = {
                    done: '已完成',
                    'in-progress': '进行中',
                    todo: '待开始',
                    blocked: '阻塞'
                };
                const statusTextColors = {
                    done: 'var(--success)',
                    'in-progress': 'var(--info)',
                    todo: 'var(--text-muted)',
                    blocked: 'var(--danger)'
                };

                sidebarRows += `
                <div class="timeline-task-row" onclick="openTaskDetail('${t.id}')">
                    <span class="timeline-task-name" title="${t.name}">${t.name}</span>
                    <div class="timeline-task-meta">
                        <span class="timeline-task-tag" style="background:${statusColors[t.status]||'var(--border-light)'};color:${statusTextColors[t.status]||'var(--text-muted)'}">${statusLabels[t.status]||t.status}</span>
                        <span class="timeline-task-tag" style="background:${priorityColor[t.priority]||'var(--border-light)'};color:${t.priority==='high'?'var(--danger)':t.priority==='medium'?'var(--warning)':'var(--info)'}">${priorityText[t.priority]||t.priority}</span>
                    </div>
                </div>`;

                // 计算任务条位置和宽度
                let taskStart, taskEnd;
                if (t.completedDate) {
                    taskStart = new Date(t.completedDate);
                    taskEnd = new Date(t.dueDate);
                    if (taskStart > taskEnd) taskStart = new Date(taskEnd);
                } else {
                    taskEnd = new Date(t.dueDate);
                    taskStart = new Date(taskEnd);
                    taskStart.setDate(taskStart.getDate() - 14);
                }
                taskStart.setHours(0,0,0,0);
                taskEnd.setHours(23,59,59,999);

                const startOffset = Math.round((taskStart - range.start) / (1000*60*60*24));
                const endOffset = Math.round((taskEnd - range.start) / (1000*60*60*24));
                const barLeft = Math.max(0, startOffset * dayWidth);
                const barWidth = Math.max(dayWidth * 0.5, Math.min((endOffset - startOffset + 1) * dayWidth, totalWidth - barLeft));

                const progress = t.status === 'done' ? 100 : t.status === 'in-progress' ? 50 : t.status === 'blocked' ? 20 : 0;
                const isOverdue = t.status !== 'done' && t.dueDate < formatDate(today);
                const barClass = isOverdue ? 'overdue' : t.status;

                const statusIcons = {
                    done: '✅',
                    'in-progress': '🔵',
                    todo: '⚪',
                    blocked: '🔴'
                };
                const barIcon = statusIcons[t.status] || '⚪';

                let barsHtml = '';
                if (endOffset >= 0 && startOffset < days) {
                    barsHtml = `<div class="timeline-bar ${barClass}" style="left:${barLeft}px;width:${barWidth}px;" onclick="openTaskDetail('${t.id}')">${barIcon} ${progress}%</div>`;
                }

                // 网格背景列
                let cellsHtml = '';
                for (let i = 0; i < days; i++) {
                    const d = new Date(range.start);
                    d.setDate(d.getDate() + i);
                    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                    cellsHtml += `<div class="timeline-grid-cell ${isWeekend?'weekend':''}" style="left:${i*dayWidth}px;width:${dayWidth}px;"></div>`;
                }

                // 今天竖线（每行都显示，但只在第一行显示标签）
                const todayOffset = Math.round((today - range.start) / (1000*60*60*24));
                let todayLine = '';
                if (todayOffset >= 0 && todayOffset < days) {
                    const showLabel = gridRows === '' ? '<span class="timeline-today-label">今天</span>' : '';
                    todayLine = `<div class="timeline-today-line" style="left:${todayOffset * dayWidth + dayWidth/2}px;">${showLabel}</div>`;
                }

                gridRows += `
                <div class="timeline-grid-row" style="width:${totalWidth}px;">
                    ${cellsHtml}
                    ${barsHtml}
                    ${todayLine}
                </div>`;
            });

            container.innerHTML = `
            <div class="gantt-container">
                <div class="gantt-toolbar">
                    <span class="gantt-toolbar-title">📊 项目时间轴（${ganttTasks.length} 个任务）</span>
                    <div class="gantt-toolbar-btns">
                        <button class="gantt-btn ${ganttViewMode==='day'?'active':''}" onclick="ganttViewChange('day')">日</button>
                        <button class="gantt-btn ${ganttViewMode==='week'?'active':''}" onclick="ganttViewChange('week')">周</button>
                        <button class="gantt-btn ${ganttViewMode==='month'?'active':''}" onclick="ganttViewChange('month')">月</button>
                    </div>
                </div>
                <div class="timeline-wrap">
                    <div class="timeline-sidebar">
                        <div class="timeline-sidebar-header">任务</div>
                        ${sidebarRows}
                    </div>
                    <div class="timeline-body">
                        <div class="timeline-header" style="width:${totalWidth}px;">${headerCells}</div>
                        <div class="timeline-grid">${gridRows}</div>
                    </div>
                </div>
            </div>`;
        }

        function getGanttRange(mode) {
            const today = new Date();
            today.setHours(0,0,0,0);
            let start = new Date(today);
            let end = new Date(today);
            if (mode === 'day') {
                start.setDate(today.getDate() - 3);
                end.setDate(today.getDate() + 3);
            } else if (mode === 'week') {
                start.setDate(today.getDate() - 14);
                end.setDate(today.getDate() + 13);
            } else {
                start.setMonth(today.getMonth() - 1);
                start.setDate(1);
                end.setMonth(today.getMonth() + 2);
                end.setDate(0);
            }
            return { start, end };
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function ganttViewChange(mode) {
            ganttViewMode = mode;
            renderGantt();
        }

        // ==================== 数据导出功能 ====================

        function toggleExportMenu() {
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('show');
        }

        // 点击外部自动关闭导出菜单
        document.addEventListener('click', function(e) {
            const dropdown = document.querySelector('.export-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                const menu = document.getElementById('exportMenu');
                if (menu) menu.classList.remove('show');
            }
        });

        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportCSV() {
            const currentTasksArr = getCurrentTasks();
            const headers = ['ID', '名称', '分类', '优先级', '紧急度', '状态', '截止日期', '完成日期', '阻塞', '标签'];
            const rows = currentTasksArr.map(t => [
                t.id,
                t.name,
                t.category,
                t.priority,
                t.urgency,
                t.status,
                t.dueDate || '',
                t.completedDate || '',
                t.blocked ? '是' : '否',
                (t.tags || []).join(';')
            ]);
            const dirLabel = currentDirection === 'recruit' ? '招聘管理' : '企业文化';
            const csv = [headers.join(','), ...rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))].join('\n');
            downloadBlob('\ufeff' + csv, `${dirLabel}_任务台账_${new Date().toISOString().split('T')[0]}.csv`, 'text/csv;charset=utf-8;');
        }

        function exportJSON() {
            const data = JSON.stringify(getCurrentTasks(), null, 2);
            const dirLabel = currentDirection === 'recruit' ? '招聘管理' : '企业文化';
            downloadBlob(data, `${dirLabel}_任务数据_${new Date().toISOString().split('T')[0]}.json`, 'application/json');
        }

        function exportWeeklyReport() {
            const today = new Date().toISOString().split('T')[0];
            const todayObj = new Date();
            const dayOfWeek = todayObj.getDay() || 7;
            const weekStart = new Date(todayObj); weekStart.setDate(todayObj.getDate() - dayOfWeek + 1);
            const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
            const weekStartStr = weekStart.toISOString().split('T')[0];
            const weekEndStr = weekEnd.toISOString().split('T')[0];

            const currentTasksArr = getCurrentTasks();
            const active = currentTasksArr.filter(t => t.status !== 'archived');

            // 本周新增（dueDate 在本周内）
            const thisWeekAdded = active.filter(t => t.dueDate >= weekStartStr && t.dueDate <= weekEndStr);
            // 本周完成
            const thisWeekDone = active.filter(t => t.completedDate >= weekStartStr && t.completedDate <= weekEndStr);
            // 本周超期
            const thisWeekOverdue = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate >= weekStartStr && t.dueDate <= weekEndStr && t.dueDate < today);

            // 各模块完成情况
            const catStats = CATEGORIES.map(cat => {
                const catTasks = active.filter(t => t.category === cat.key);
                const total = catTasks.length;
                const done = catTasks.filter(t => t.status === 'done').length;
                const overdue = catTasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < today).length;
                return { ...cat, total, done, overdue, rate: total > 0 ? Math.round(done / total * 100) : 0 };
            });

            // 延期风险任务
            const riskTasks = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < today);

            // 下周计划（待开始 + 进行中）
            const nextWeekPlan = active.filter(t => t.status === 'todo' || t.status === 'in-progress');

            const dirLabel = currentDirection === 'recruit' ? '招聘管理' : '企业文化';
            let md = `# 📊 ${dirLabel}工作周报\n\n`;
            md += `> 生成时间：${today}\n`;
            md += `> 统计周期：${weekStartStr} 至 ${weekEndStr}\n\n`;

            md += `## 一、本周工作总结\n\n`;
            md += `- **本周新增任务**：${thisWeekAdded.length} 项\n`;
            md += `- **本周完成任务**：${thisWeekDone.length} 项\n`;
            md += `- **本周超期任务**：${thisWeekOverdue.length} 项\n\n`;

            md += `## 二、各模块完成情况\n\n`;
            md += `| 模块 | 总数 | 已完成 | 完成率 | 超期数 |\n`;
            md += `|------|------|--------|--------|--------|\n`;
            catStats.forEach(c => {
                md += `| ${c.icon} ${c.key} | ${c.total} | ${c.done} | ${c.rate}% | ${c.overdue} |\n`;
            });
            md += `\n`;

            md += `## 三、延期风险任务列表\n\n`;
            if (riskTasks.length === 0) {
                md += `✅ 暂无延期风险任务\n\n`;
            } else {
                md += `| 任务名称 | 分类 | 截止日期 | 延迟天数 |\n`;
                md += `|----------|------|----------|----------|\n`;
                riskTasks.forEach(t => {
                    const days = Math.ceil((todayObj - new Date(t.dueDate)) / 86400000);
                    md += `| ${t.name} | ${t.category} | ${t.dueDate} | ${days}天 |\n`;
                });
                md += `\n`;
            }

            md += `## 四、下周工作计划\n\n`;
            if (nextWeekPlan.length === 0) {
                md += `暂无待执行的任务\n\n`;
            } else {
                md += `| 任务名称 | 分类 | 状态 | 截止日期 |\n`;
                md += `|----------|------|------|----------|\n`;
                nextWeekPlan.forEach(t => {
                    md += `| ${t.name} | ${t.category} | ${statusLabel(t.status)} | ${t.dueDate || '-'} |\n`;
                });
                md += `\n`;
            }

            md += `---\n`;
            md += `*本报告由人力资源工作看板自动生成*\n`;

            downloadBlob(md, `工作周报_${weekStartStr}.md`, 'text/markdown');
        }

        // ==================== 方向切换 ====================

        function switchDirection(direction) {
            if (currentDirection === direction) return;
            currentDirection = direction;
            localStorage.setItem('hr_current_direction', direction);

            // 更新Tab按钮样式
            document.querySelectorAll('.direction-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.direction === direction) {
                    tab.classList.add('active');
                }
            });

            // 更新分类筛选器选项
            updateCategoryFilter();

            // 更新目标输入框的默认值和placeholder
            const goalInput = document.getElementById('goalInput');
            if (goalInput) {
                if (direction === 'recruit') {
                    goalInput.placeholder = '输入本月招聘目标...';
                } else {
                    goalInput.placeholder = '输入本月目标...';
                }
                // 恢复该方向的目标值
                const savedGoal = localStorage.getItem(getGoalKey());
                if (savedGoal) {
                    goalInput.value = savedGoal;
                }
            }

            // 刷新所有模块
            refreshAll();
            renderKanban();
            renderDashboard();
            renderGantt();
            renderAnalyticsPanel();
        }

        function updateCategoryFilter() {
            const filterCategory = document.getElementById('filterCategory');
            if (!filterCategory) return;
            const cats = currentDirection === 'recruit'
                ? ['简历筛选', '面试邀约', 'Offer跟进', '入职办理', '招聘数据', '渠道管理']
                : ['文化活动', '员工关怀', '品牌传播', '视觉设计', '培训发展', '荣誉激励'];
            filterCategory.innerHTML = '<option value="all">所有分类</option>' +
                cats.map(c => `<option value="${c}">${c}</option>`).join('');

            // 更新弹窗中的分类 datalist
            const categoryList = document.getElementById('categoryList');
            if (categoryList) {
                categoryList.innerHTML = cats.map(c => `<option value="${c}">`).join('');
            }
        }

        // ==================== 可视化分析面板 ====================

        let analyticsCollapsed = false;

        const CATEGORIES_CULTURE = [
            { key: '文化活动', icon: '🎯', color: '#4f46e5' },
            { key: '员工关怀', icon: '💝', color: '#059669' },
            { key: '品牌传播', icon: '📢', color: '#d97706' },
            { key: '视觉设计', icon: '🎨', color: '#dc2626' },
            { key: '培训发展', icon: '📚', color: '#6366f1' },
            { key: '荣誉激励', icon: '🏆', color: '#e11d48' }
        ];

        const CATEGORIES_RECRUIT = [
            { key: '简历筛选', icon: '📋', color: '#2563eb' },
            { key: '面试邀约', icon: '📞', color: '#059669' },
            { key: 'Offer跟进', icon: '🤝', color: '#d97706' },
            { key: '入职办理', icon: '🎓', color: '#dc2626' },
            { key: '招聘数据', icon: '📊', color: '#6366f1' },
            { key: '渠道管理', icon: '🔄', color: '#e11d48' }
        ];

        // 根据当前方向返回对应的 CATEGORIES
        function getCategories() {
            return currentDirection === 'recruit' ? CATEGORIES_RECRUIT : CATEGORIES_CULTURE;
        }

        // 为了兼容现有代码中直接引用 CATEGORIES 的地方，使用 getter
        Object.defineProperty(window, 'CATEGORIES', {
            get: function() { return getCategories(); },
            configurable: true
        });

        function toggleAnalytics() {
            analyticsCollapsed = !analyticsCollapsed;
            const content = document.getElementById('analyticsContent');
            const btn = document.querySelector('.analytics-toggle');
            if (analyticsCollapsed) {
                content.style.display = 'none';
                btn.textContent = '展开 ▼';
            } else {
                content.style.display = 'block';
                btn.textContent = '收起 ▲';
            }
        }

        function renderAnalyticsPanel() {
            const kpiEl = document.getElementById('analyticsKPIs');
            const chartEl = document.getElementById('analyticsCharts');
            if (!kpiEl || !chartEl) return;

            const currentTasks = getCurrentTasks();
            const today = new Date().toISOString().split('T')[0];
            const active = currentTasks.filter(t => t.status !== 'archived');
            const total = active.length;

            // 6模块KPI卡片：每个模块显示 任务数/完成率/超期数
            const catKPIs = CATEGORIES.map(cat => {
                const catTasks = active.filter(t => t.category === cat.key);
                const catTotal = catTasks.length;
                const catDone = catTasks.filter(t => t.status === 'done').length;
                const catOverdue = catTasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < today).length;
                const catRate = catTotal > 0 ? Math.round(catDone / catTotal * 100) : 0;
                // 健康度：绿=正常(完成率>=70且超期<=1)、黄=关注(完成率>=50或超期<=2)、红=告警
                let health = 'green';
                if (catTotal === 0) health = 'gray';
                else if (catRate >= 70 && catOverdue <= 1) health = 'green';
                else if (catRate >= 50 || catOverdue <= 2) health = 'yellow';
                else health = 'red';
                const healthColors = { green: '#059669', yellow: '#d97706', red: '#dc2626', gray: '#9ca3af' };
                return { ...cat, catTotal, catDone, catOverdue, catRate, healthColor: healthColors[health] };
            });

            // 问题诊断矩阵：横轴=6模块，纵轴=状态，用热力图展示
            const statuses = ['todo', 'in-progress', 'done', 'blocked'];
            const statusNames = { 'todo': '待开始', 'in-progress': '进行中', 'done': '已完成', 'blocked': '阻塞' };
            const matrixData = statuses.map(st => {
                return CATEGORIES.map(cat => active.filter(t => t.category === cat.key && t.status === st).length);
            });
            const maxMatrix = Math.max(...matrixData.flat(), 1);

            // 延期风险雷达：即将到期（3天内）和已超期的任务，按模块分组
            const soonTasks = active.filter(t => {
                if (t.status === 'done' || !t.dueDate) return false;
                const due = new Date(t.dueDate);
                const now = new Date();
                const diff = Math.ceil((due - now) / 86400000);
                return diff >= 0 && diff <= 3;
            });
            const overdueTasks = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < today);

            // 工作负载分布：每个模块的待办/进行中/已完成 堆叠柱状图
            const workloadData = CATEGORIES.map(cat => {
                const catTasks = active.filter(t => t.category === cat.key);
                return {
                    cat: cat.key,
                    todo: catTasks.filter(t => t.status === 'todo').length,
                    inProgress: catTasks.filter(t => t.status === 'in-progress').length,
                    done: catTasks.filter(t => t.status === 'done').length,
                    blocked: catTasks.filter(t => t.status === 'blocked').length
                };
            });
            const maxWorkload = Math.max(...workloadData.map(d => d.todo + d.inProgress + d.done + d.blocked), 1);

            // 趋势折线图：最近7天的新增/完成/超期趋势（SVG手绘）
            const trendDays = 7;
            const trendData = [];
            for (let i = trendDays - 1; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                // 新增：按id中的时间戳或简单按日期（这里用dueDate近似）
                const added = active.filter(t => t.dueDate === ds).length;
                const completed = active.filter(t => t.completedDate === ds).length;
                const overdueDay = active.filter(t => t.dueDate === ds && t.status !== 'done').length;
                trendData.push({ date: `${d.getMonth()+1}/${d.getDate()}`, added, completed, overdueDay });
            }

            // 渲染6模块KPI卡片
            kpiEl.innerHTML = catKPIs.map(k => `
                <div class="analytics-kpi" style="border-top:3px solid ${k.healthColor}">
                    <div class="analytics-kpi-icon">${k.icon}</div>
                    <div class="analytics-kpi-num" style="color:${k.color}">${k.catTotal}</div>
                    <div class="analytics-kpi-label">${k.key}</div>
                    <div class="analytics-kpi-trend" style="font-size:11px;margin-top:6px">
                        <span style="color:var(--success)">${k.catRate}%完成</span> · 
                        <span style="color:${k.catOverdue > 0 ? 'var(--danger)' : 'var(--text-muted)'}">${k.catOverdue}超期</span>
                    </div>
                </div>
            `).join('');

            // 渲染图表行
            chartEl.innerHTML = `
                <div class="analytics-card" style="grid-column:1/-1">
                    <div class="analytics-card-title">🔥 问题诊断矩阵（模块 × 状态）</div>
                    <div style="display:flex;gap:4px;flex-direction:column">
                        <div style="display:flex;gap:4px;margin-bottom:4px">
                            <div style="width:60px"></div>
                            ${CATEGORIES.map(c => `<div style="flex:1;text-align:center;font-size:11px;color:var(--text-muted)">${c.icon}</div>`).join('')}
                        </div>
                        ${statuses.map((st, si) => `
                        <div style="display:flex;gap:4px;align-items:center">
                            <div style="width:60px;font-size:11px;color:var(--text-secondary)">${statusNames[st]}</div>
                            ${CATEGORIES.map((c, ci) => {
                                const val = matrixData[si][ci];
                                const intensity = val / maxMatrix;
                                const bg = val > 0 ? `rgba(220,38,38,${0.1 + intensity * 0.4})` : 'var(--border-light)';
                                return `<div style="flex:1;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:${intensity > 0.5 ? '#fff' : 'var(--text-secondary)'};background:${bg}">${val || ''}</div>`;
                            }).join('')}
                        </div>`).join('')}
                    </div>
                </div>

                <div class="analytics-card">
                    <div class="analytics-card-title">🚨 延期风险雷达</div>
                    <div style="margin-bottom:12px">
                        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">即将到期（3天内）· ${soonTasks.length}项</div>
                        ${soonTasks.length === 0 ? '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">暂无</div>' : soonTasks.slice(0, 5).map(t => {
                            const cat = CATEGORIES.find(c => c.key === t.category) || CATEGORIES[0];
                            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--border-light);border-radius:6px;margin-bottom:4px;font-size:12px">
                                <span style="color:var(--text-primary)">${t.name}</span>
                                <span style="color:${cat.color};font-size:11px">${cat.icon} ${t.dueDate}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    <div>
                        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">已超期 · ${overdueTasks.length}项</div>
                        ${overdueTasks.length === 0 ? '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">暂无</div>' : overdueTasks.slice(0, 5).map(t => {
                            const cat = CATEGORIES.find(c => c.key === t.category) || CATEGORIES[0];
                            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--danger-light);border-radius:6px;margin-bottom:4px;font-size:12px">
                                <span style="color:var(--text-primary)">${t.name}</span>
                                <span style="color:var(--danger);font-size:11px">${cat.icon} ${t.dueDate}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <div class="analytics-card">
                    <div class="analytics-card-title">📊 工作负载分布</div>
                    <div style="display:flex;flex-direction:column;gap:8px">
                        ${workloadData.map(d => {
                            const totalBar = d.todo + d.inProgress + d.done + d.blocked;
                            const todoW = totalBar > 0 ? (d.todo / maxWorkload * 100) : 0;
                            const ipW = totalBar > 0 ? (d.inProgress / maxWorkload * 100) : 0;
                            const doneW = totalBar > 0 ? (d.done / maxWorkload * 100) : 0;
                            const blockW = totalBar > 0 ? (d.blocked / maxWorkload * 100) : 0;
                            return `<div style="display:flex;align-items:center;gap:8px">
                                <div style="width:70px;font-size:11px;color:var(--text-secondary);text-align:right">${d.cat.slice(0,4)}</div>
                                <div style="flex:1;height:20px;background:var(--border-light);border-radius:10px;overflow:hidden;display:flex">
                                    <div style="width:${todoW}%;background:#9ca3af"></div>
                                    <div style="width:${ipW}%;background:var(--info)"></div>
                                    <div style="width:${doneW}%;background:var(--success)"></div>
                                    <div style="width:${blockW}%;background:var(--danger)"></div>
                                </div>
                                <div style="width:28px;font-size:11px;color:var(--text-muted);text-align:right">${totalBar}</div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div style="display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:10px">
                        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#9ca3af;margin-right:4px"></span>待办</span>
                        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--info);margin-right:4px"></span>进行中</span>
                        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--success);margin-right:4px"></span>已完成</span>
                        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--danger);margin-right:4px"></span>阻塞</span>
                    </div>
                </div>

                <div class="analytics-card">
                    <div class="analytics-card-title">📈 7天趋势</div>
                    <svg width="100%" height="140" viewBox="0 0 280 140" style="overflow:visible">
                        ${renderTrendLine(trendData, 'added', '#4f46e5', 280, 140)}
                        ${renderTrendLine(trendData, 'completed', '#059669', 280, 140)}
                        ${renderTrendLine(trendData, 'overdueDay', '#dc2626', 280, 140)}
                        ${trendData.map((d, i) => `<text x="${20 + i * (240 / (trendData.length - 1))}" y="135" font-size="9" fill="#9ca3af" text-anchor="middle">${d.date}</text>`).join('')}
                    </svg>
                    <div style="display:flex;gap:12px;justify-content:center;margin-top:4px;font-size:10px">
                        <span><span style="display:inline-block;width:12px;height:2px;background:#4f46e5;margin-right:4px;vertical-align:middle"></span>新增</span>
                        <span><span style="display:inline-block;width:12px;height:2px;background:#059669;margin-right:4px;vertical-align:middle"></span>完成</span>
                        <span><span style="display:inline-block;width:12px;height:2px;background:#dc2626;margin-right:4px;vertical-align:middle"></span>超期</span>
                    </div>
                </div>`;
        }

        function renderTrendLine(data, key, color, w, h) {
            if (data.length < 2) return '';
            const maxVal = Math.max(...data.map(d => d[key]), 1);
            const points = data.map((d, i) => {
                const x = 20 + i * ((w - 40) / (data.length - 1));
                const y = h - 20 - (d[key] / maxVal) * (h - 40);
                return `${x},${y}`;
            }).join(' ');
            return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                ${data.map((d, i) => {
                    const x = 20 + i * ((w - 40) / (data.length - 1));
                    const y = h - 20 - (d[key] / maxVal) * (h - 40);
                    return `<circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`;
                }).join('')}`;
        }

        // ==================== 初始化 ====================
        loadTasks();
        // 恢复方向Tab状态
        document.querySelectorAll('.direction-tab').forEach(tab => {
            tab.classList.remove('active');
            if (tab.dataset.direction === currentDirection) {
                tab.classList.add('active');
            }
        });
        updateCategoryFilter();
        updateKPI();
        updateRisks();
        initGoal();
        renderTable();
        renderTodo();
        renderKanban();
        renderDashboard();
        renderGantt();
        renderAnalyticsPanel();
        bindFilters();
        bindTodoFilters();
    </script>
</body>
</html>
